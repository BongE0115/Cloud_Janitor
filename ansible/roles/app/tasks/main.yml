---
# =============================================================================
# Cloud Janitor Application Deployment
# Management Cluster에 Cloud Janitor 앱 배포
# Target Prometheus API를 호출하여 좀비 컨테이너 감지 및 삭제
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Namespace 확인
# -----------------------------------------------------------------------------
- name: Ensure default namespace exists
  kubernetes.core.k8s:
    name: default
    kind: Namespace
    state: present
    api_version: v1

# -----------------------------------------------------------------------------
# 1.5. Cloud Janitor 이미지 준비 (kind 노드 로드)
# 클러스터 재생성 후에도 ImagePullBackOff 없이 즉시 실행되도록 보장
# -----------------------------------------------------------------------------
- name: Ensure Cloud Janitor image exists locally
  ansible.builtin.command: docker image inspect cloud-janitor:latest
  register: cloud_janitor_image_check
  failed_when: false
  changed_when: false

- name: Build Cloud Janitor image when missing
  ansible.builtin.command: docker build -t cloud-janitor:latest .
  args:
    chdir: "{{ role_path }}/../../.."
  when: cloud_janitor_image_check.rc != 0

- name: Load Cloud Janitor image into kind cluster
  ansible.builtin.command: kind load docker-image cloud-janitor:latest --name cloud-janitor-cluster
  changed_when: false

# -----------------------------------------------------------------------------
# 2. MySQL Database 테이블 초기화
# MySQL은 Terraform에서 배포됨 (mysql 네임스페이스)
# -----------------------------------------------------------------------------
- name: Wait for MySQL to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: mysql
    label_selectors:
      - app = mysql
  register: mysql_pod
  until: mysql_pod.resources[0].status.phase == "Running"
  retries: 30
  delay: 5

- name: Create MySQL init script ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: mysql-init-scripts
        namespace: mysql
      data:
        mysql-init.sh: "{{ lookup('file', role_path + '/files/mysql-init.sh') }}"
        mysql-init.sql: "{{ lookup('file', role_path + '/files/mysql-init.sql') }}"
  run_once: true

- name: Create deletion logs table in MySQL
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: mysql-init-{{ lookup('pipe', 'date +%s') }}
        namespace: mysql
      spec:
        template:
          spec:
            restartPolicy: OnFailure
            volumes:
              - name: mysql-init-scripts
                configMap:
                  name: mysql-init-scripts
            containers:
              - name: mysql-init
                image: mysql:8.0
                env:
                  - name: MYSQL_HOST
                    value: "mysql.mysql.svc.cluster.local"
                  - name: MYSQL_ROOT_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: mysql-secret
                        key: mysql-root-password
                  - name: MYSQL_DATABASE
                    value: "janitor_db"
                command: ["/bin/bash", "/opt/mysql-init/mysql-init.sh"]
                volumeMounts:
                  - name: mysql-init-scripts
                    mountPath: /opt/mysql-init
  run_once: true

# -----------------------------------------------------------------------------
# 3. Cloud Janitor ConfigMap 생성
# -----------------------------------------------------------------------------
- name: Create Cloud Janitor ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cloud-janitor-config
        namespace: default
      data:
        config.yaml: |
          # Cloud Janitor Configuration
          # Management Cluster(cj)에서 Target Cluster(TC) 메트릭 수집
          
          # Prometheus Connection (Target Cluster)
          # cj가 TC의 Prometheus API를 직접 폴링
          prometheus:
            url: "{{ prometheus_internal_url | default('') }}"
            timeout: 30
          
          # Zombie Detection Criteria
          detection:
            cpu:
              limit_millicores: "{{ LIMIT_CPU_M | default('10.0') }}"
              time_window: "{{ TIME_WINDOW_CPU | default('2m') }}"
            network:
              limit_bytes: "{{ LIMIT_NET_B | default('100.0') }}"
              time_window: "{{ TIME_WINDOW_NET | default('2m') }}"
            memory:
              limit_mb: "{{ LIMIT_MEM_MI | default('1.0') }}"
          
          # Deletion Control
          deletion:
            dry_run: "{{ DRY_RUN | default('True') }}"
            cost_per_core_hour: "{{ COST_PER_CORE_HOUR | default('0.1') }}"
            default_cpu_request: "{{ DEFAULT_CPU_REQ | default('0.2') }}"
          
          # Target Cluster Configuration (Docker API)
          # cj가 TC의 Docker API에 직접 접근하여 좀비 컨테이너 삭제
          target_cluster:
            type: "docker"
            host: "unix:///var/run/docker.sock"
            # For remote Docker daemon:
            # host: "tcp://target-host:2375"
          
          # Logging
          logging:
            level: "INFO"
            file: "/var/log/cloud-janitor/janitor.log"

# -----------------------------------------------------------------------------
# 3.5. Cloud Janitor Runtime Code ConfigMap
# 이미지 재빌드 없이 로컬 파이썬 코드를 주입하기 위한 설정
# -----------------------------------------------------------------------------
- name: Create Cloud Janitor Runtime Code ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cloud-janitor-runtime-code
        namespace: default
      data:
        main.py: "{{ lookup('file', role_path + '/../../../main.py') }}"
        database.py: "{{ lookup('file', role_path + '/../../../py_Logic/database.py') }}"
        janitor_logic.py: "{{ lookup('file', role_path + '/../../../py_Logic/janitor_logic.py') }}"
        metrics.py: "{{ lookup('file', role_path + '/../../../py_Logic/metrics.py') }}"

# -----------------------------------------------------------------------------
# 4. Cloud Janitor Secret 생성 (MySQL 비밀번호)
# -----------------------------------------------------------------------------
- name: Create Cloud Janitor Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloud-janitor-secret
        namespace: default
      type: Opaque
      stringData:
        db-host: "{{ env_vars['DB_HOST'] | default('mysql.mysql.svc.cluster.local') }}"
        db-user: "{{ env_vars['DB_USER'] | default('root') }}"
        db-password: "{{ env_vars['DB_PASSWORD'] | default('rootpassword') }}"
        db-name: "{{ env_vars['DB_NAME'] | default('janitor_db') }}"
        grafana-url: "{{ env_vars['GRAFANA_URL'] | default('http://grafana.monitoring.svc.cluster.local:3000') }}"
        grafana-user: "{{ env_vars['GRAFANA_USER'] | default('admin') }}"
        grafana-password: "{{ env_vars['GRAFANA_PASSWORD'] | default('admin') }}"

# -----------------------------------------------------------------------------
# 5. Cloud Janitor RBAC (권한 설정)
# -----------------------------------------------------------------------------
- name: Create Cloud Janitor ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: cloud-janitor
        namespace: default

- name: Create Cloud Janitor ClusterRole
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: cloud-janitor
      rules:
        - apiGroups: [""]
          resources: ["pods", "namespaces", "secrets", "configmaps", "services", "endpoints"]
          verbs: ["get", "list", "watch", "delete", "create", "update"]
        - apiGroups: ["batch"]
          resources: ["cronjobs", "jobs"]
          verbs: ["get", "list", "watch", "create", "update", "delete"]

- name: Create Cloud Janitor ClusterRoleBinding
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: cloud-janitor
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cloud-janitor
      subjects:
        - kind: ServiceAccount
          name: cloud-janitor
          namespace: default

# -----------------------------------------------------------------------------
# 6. Cloud Janitor Deployment (Cloud Janitor 앱 배포)
# -----------------------------------------------------------------------------
- name: Deploy Cloud Janitor
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cloud-janitor
        namespace: default
        labels:
          app: cloud-janitor
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: cloud-janitor
        template:
          metadata:
            labels:
              app: cloud-janitor
          spec:
            serviceAccountName: cloud-janitor
            
            # Volumes (Docker socket not supported in Kind)
            volumes:
              - name: log-dir
                emptyDir: {}
              - name: runtime-code
                configMap:
                  name: cloud-janitor-runtime-code
              - name: docker-sock
                hostPath:
                  path: /var/run/docker.sock
            
            # InitContainer: Run initial scan on pod startup
            initContainers:
              - name: initial-scan
                image: cloud-janitor:latest
                imagePullPolicy: IfNotPresent
                env:
                  - name: LOKI_URL
                    value: "{{ env_vars['LOKI_URL'] | default('http://loki.monitoring.svc.cluster.local:3100') }}"
                  - name: DB_HOST
                    valueFrom:
                      secretKeyRef:
                        name: cloud-janitor-secret
                        key: db-host
                  - name: DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: cloud-janitor-secret
                        key: db-user
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: cloud-janitor-secret
                        key: db-password
                  - name: DB_NAME
                    valueFrom:
                      secretKeyRef:
                        name: cloud-janitor-secret
                        key: db-name
                  - name: LIMIT_CPU_M
                    value: "{{ env_vars['LIMIT_CPU_M'] | default('10.0') }}"
                  - name: TIME_WINDOW_CPU
                    value: "{{ env_vars['TIME_WINDOW_CPU'] | default('2m') }}"
                  - name: LIMIT_NET_B
                    value: "{{ env_vars['LIMIT_NET_B'] | default('100.0') }}"
                  - name: TIME_WINDOW_NET
                    value: "{{ env_vars['TIME_WINDOW_NET'] | default('2m') }}"
                  - name: DRY_RUN
                    value: "{{ env_vars['DRY_RUN'] | default('True') }}"
                  - name: COST_PER_CORE_HOUR
                    value: "{{ env_vars['COST_PER_CORE_HOUR'] | default('0.1') }}"
                  - name: DEFAULT_CPU_REQ
                    value: "{{ env_vars['DEFAULT_CPU_REQ'] | default('0.2') }}"
                  - name: GRACE_PERIOD_MINUTES
                    value: "{{ env_vars['GRACE_PERIOD_MINUTES'] | default('10') }}"
                  - name: DOCKER_API_URL
                    value: "{{ env_vars['DOCKER_API_URL'] | default('unix:///var/run/docker.sock') }}"
                  - name: WHITE_LIST_NS
                    value: "kube-system,prometheus,local-path-storage,monitoring"
                  - name: TARGET_NAMESPACES
                    value: "default,zombie-zone"
                command:
                  - python
                  - main.py
                  - scan
                volumeMounts:
                  - name: log-dir
                    mountPath: /var/log/cloud-janitor
                  - name: docker-sock
                    mountPath: /var/run/docker.sock
                  - name: runtime-code
                    mountPath: /app/main.py
                    subPath: main.py
                  - name: runtime-code
                    mountPath: /app/py_Logic/database.py
                    subPath: database.py
                  - name: runtime-code
                    mountPath: /app/py_Logic/janitor_logic.py
                    subPath: janitor_logic.py
                  - name: runtime-code
                    mountPath: /app/py_Logic/metrics.py
                    subPath: metrics.py
                resources:
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
            
            containers:
              - name: cloud-janitor
                image: cloud-janitor:latest
                imagePullPolicy: IfNotPresent
                
                env:
                  - name: LOKI_URL
                    value: "{{ env_vars['LOKI_URL'] | default('http://loki.monitoring.svc.cluster.local:3100') }}"
                
                  # Database Configuration
                  - name: DB_HOST
                    valueFrom:
                      secretKeyRef:
                        name: cloud-janitor-secret
                        key: db-host
                  - name: DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: cloud-janitor-secret
                        key: db-user
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: cloud-janitor-secret
                        key: db-password
                  - name: DB_NAME
                    valueFrom:
                      secretKeyRef:
                        name: cloud-janitor-secret
                        key: db-name

                  - name: GRAFANA_URL
                    valueFrom:
                      secretKeyRef:
                        name: cloud-janitor-secret
                        key: grafana-url
                  - name: GRAFANA_USER
                    valueFrom:
                      secretKeyRef:
                        name: cloud-janitor-secret
                        key: grafana-user
                  - name: GRAFANA_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: cloud-janitor-secret
                        key: grafana-password
                
                  # Detection Criteria
                  - name: LIMIT_CPU_M
                    value: "{{ env_vars['LIMIT_CPU_M'] | default('10.0') }}"
                  - name: TIME_WINDOW_CPU
                    value: "{{ env_vars['TIME_WINDOW_CPU'] | default('2m') }}"
                  - name: LIMIT_NET_B
                    value: "{{ env_vars['LIMIT_NET_B'] | default('100.0') }}"
                  - name: TIME_WINDOW_NET
                    value: "{{ env_vars['TIME_WINDOW_NET'] | default('2m') }}"
                
                  # Deletion Control
                  - name: DRY_RUN
                    value: "{{ env_vars['DRY_RUN'] | default('True') }}"
                  - name: COST_PER_CORE_HOUR
                    value: "{{ env_vars['COST_PER_CORE_HOUR'] | default('0.1') }}"
                  - name: DEFAULT_CPU_REQ
                    value: "{{ env_vars['DEFAULT_CPU_REQ'] | default('0.2') }}"
                  - name: GRACE_PERIOD_MINUTES
                    value: "{{ env_vars['GRACE_PERIOD_MINUTES'] | default('10') }}"
                  - name: DOCKER_API_URL
                    value: "{{ env_vars['DOCKER_API_URL'] | default('unix:///var/run/docker.sock') }}"
                  # Run mode for initial scan
                  - name: RUN_MODE
                    value: "serve"
                
                ports:
                  - name: http
                    containerPort: 8000
                    protocol: TCP
                
                volumeMounts:
                  - name: log-dir
                    mountPath: /var/log/cloud-janitor
                  - name: docker-sock
                    mountPath: /var/run/docker.sock
                  - name: runtime-code
                    mountPath: /app/main.py
                    subPath: main.py
                  - name: runtime-code
                    mountPath: /app/py_Logic/database.py
                    subPath: database.py
                  - name: runtime-code
                    mountPath: /app/py_Logic/janitor_logic.py
                    subPath: janitor_logic.py
                  - name: runtime-code
                    mountPath: /app/py_Logic/metrics.py
                    subPath: metrics.py
                
                resources:
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
                
                livenessProbe:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                
                readinessProbe:
                  httpGet:
                    path: /ready
                    port: 8000
                  initialDelaySeconds: 10
                  periodSeconds: 5

# -----------------------------------------------------------------------------
# 7. Cloud Janitor Service
# -----------------------------------------------------------------------------
- name: Create Cloud Janitor Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: cloud-janitor
        namespace: default
        labels:
          app: cloud-janitor
      spec:
        type: NodePort
        ports:
          - name: http
            port: 8000
            targetPort: 8000
            nodePort: 30800
            protocol: TCP
        selector:
          app: cloud-janitor

# -----------------------------------------------------------------------------
# 8. Cloud Janitor CronJob (정기적 좀비 파드 감지 및 삭제)
# -----------------------------------------------------------------------------
- name: Create Cloud Janitor CronJob
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: cloud-janitor-scanner
        namespace: default
      spec:
        schedule: "*/1 * * * *"  # 매 1분마다 실행
        jobTemplate:
          spec:
            backoffLimit: 3
            activeDeadlineSeconds: 300
            template:
              spec:
                serviceAccountName: cloud-janitor
                restartPolicy: OnFailure
                volumes:
                  - name: runtime-code
                    configMap:
                      name: cloud-janitor-runtime-code
                  - name: docker-sock
                    hostPath:
                      path: /var/run/docker.sock
                containers:
                  - name: scanner
                    image: cloud-janitor:latest
                    imagePullPolicy: IfNotPresent
                    
                    env:
                      # Copy same environment variables from deployment
                      - name: LOKI_URL
                        value: "{{ env_vars['LOKI_URL'] | default('http://loki.monitoring.svc.cluster.local:3100') }}"
                      - name: DB_HOST
                        valueFrom:
                          secretKeyRef:
                            name: cloud-janitor-secret
                            key: db-host
                      - name: DB_USER
                        valueFrom:
                          secretKeyRef:
                            name: cloud-janitor-secret
                            key: db-user
                      - name: DB_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: cloud-janitor-secret
                            key: db-password
                      - name: DB_NAME
                        valueFrom:
                          secretKeyRef:
                            name: cloud-janitor-secret
                            key: db-name
                      - name: LIMIT_CPU_M
                        value: "{{ env_vars['LIMIT_CPU_M'] | default('10.0') }}"
                      - name: TIME_WINDOW_CPU
                        value: "{{ env_vars['TIME_WINDOW_CPU'] | default('2m') }}"
                      - name: LIMIT_NET_B
                        value: "{{ env_vars['LIMIT_NET_B'] | default('100.0') }}"
                      - name: TIME_WINDOW_NET
                        value: "{{ env_vars['TIME_WINDOW_NET'] | default('2m') }}"
                      - name: DRY_RUN
                        value: "{{ env_vars['DRY_RUN'] | default('True') }}"
                      - name: COST_PER_CORE_HOUR
                        value: "{{ env_vars['COST_PER_CORE_HOUR'] | default('0.1') }}"
                      - name: DEFAULT_CPU_REQ
                        value: "{{ env_vars['DEFAULT_CPU_REQ'] | default('0.2') }}"
                      - name: GRACE_PERIOD_MINUTES
                        value: "{{ env_vars['GRACE_PERIOD_MINUTES'] | default('10') }}"
                      - name: DOCKER_API_URL
                        value: "{{ env_vars['DOCKER_API_URL'] | default('unix:///var/run/docker.sock') }}"
                      - name: WHITE_LIST_NS
                        value: "kube-system,prometheus,local-path-storage,monitoring"
                      - name: TARGET_NAMESPACES
                        value: "default,zombie-zone"
                    
                    command:
                      - python
                      - main.py
                      - scan
                    volumeMounts:
                      - name: docker-sock
                        mountPath: /var/run/docker.sock
                      - name: runtime-code
                        mountPath: /app/main.py
                        subPath: main.py
                      - name: runtime-code
                        mountPath: /app/py_Logic/database.py
                        subPath: database.py
                      - name: runtime-code
                        mountPath: /app/py_Logic/janitor_logic.py
                        subPath: janitor_logic.py
                      - name: runtime-code
                        mountPath: /app/py_Logic/metrics.py
                        subPath: metrics.py
                    
                    resources:
                      requests:
                        cpu: "100m"
                        memory: "128Mi"
                      limits:
                        cpu: "500m"
                        memory: "512Mi"

# -----------------------------------------------------------------------------
# 9. Cloud Janitor Cleanup CronJob (유예기간 만료 대상 삭제)
# -----------------------------------------------------------------------------
- name: Create Cloud Janitor Cleanup CronJob
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: cloud-janitor-cleanup
        namespace: default
      spec:
        schedule: "*/1 * * * *"
        concurrencyPolicy: Forbid
        jobTemplate:
          spec:
            backoffLimit: 3
            activeDeadlineSeconds: 300
            template:
              spec:
                serviceAccountName: cloud-janitor
                restartPolicy: OnFailure
                volumes:
                  - name: runtime-code
                    configMap:
                      name: cloud-janitor-runtime-code
                  - name: docker-sock
                    hostPath:
                      path: /var/run/docker.sock
                containers:
                  - name: cleanup
                    image: cloud-janitor:latest
                    imagePullPolicy: IfNotPresent

                    env:
                      - name: LOKI_URL
                        value: "{{ env_vars['LOKI_URL'] | default('http://loki.monitoring.svc.cluster.local:3100') }}"
                      - name: DB_HOST
                        valueFrom:
                          secretKeyRef:
                            name: cloud-janitor-secret
                            key: db-host
                      - name: DB_USER
                        valueFrom:
                          secretKeyRef:
                            name: cloud-janitor-secret
                            key: db-user
                      - name: DB_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: cloud-janitor-secret
                            key: db-password
                      - name: DB_NAME
                        valueFrom:
                          secretKeyRef:
                            name: cloud-janitor-secret
                            key: db-name
                      - name: DRY_RUN
                        value: "{{ env_vars['DRY_RUN'] | default('True') }}"
                      - name: COST_PER_CORE_HOUR
                        value: "{{ env_vars['COST_PER_CORE_HOUR'] | default('0.1') }}"
                      - name: DEFAULT_CPU_REQ
                        value: "{{ env_vars['DEFAULT_CPU_REQ'] | default('0.2') }}"
                      - name: GRACE_PERIOD_MINUTES
                        value: "{{ env_vars['GRACE_PERIOD_MINUTES'] | default('10') }}"
                      - name: DOCKER_API_URL
                        value: "{{ env_vars['DOCKER_API_URL'] | default('unix:///var/run/docker.sock') }}"

                    command:
                      - python
                      - main.py
                      - cleanup
                    volumeMounts:
                      - name: docker-sock
                        mountPath: /var/run/docker.sock
                      - name: runtime-code
                        mountPath: /app/main.py
                        subPath: main.py
                      - name: runtime-code
                        mountPath: /app/py_Logic/database.py
                        subPath: database.py
                      - name: runtime-code
                        mountPath: /app/py_Logic/janitor_logic.py
                        subPath: janitor_logic.py
                      - name: runtime-code
                        mountPath: /app/py_Logic/metrics.py
                        subPath: metrics.py

                    resources:
                      requests:
                        cpu: "100m"
                        memory: "128Mi"
                      limits:
                        cpu: "500m"
                        memory: "512Mi"
