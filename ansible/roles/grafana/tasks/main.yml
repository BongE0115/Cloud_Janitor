---
# =============================================================================
# Grafana 설정 — Datasource 등록 + 대시보드 Import
# Terraform이 인프라(Helm)를 설치한 뒤, Ansible이 설정을 주입합니다.
# =============================================================================

# 1) Grafana Health 대기
- name: Wait for Grafana to be ready
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/health"
    method: GET
    status_code: 200
  register: _grafana_health
  until: _grafana_health.status == 200
  retries: 30
  delay: 10

# ── Datasource: Prometheus ──────────────────────────────────────────────────

- name: Get existing Prometheus datasource
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/datasources/name/Prometheus"
    method: GET
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: _prom_existing

- name: Create Prometheus datasource
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/datasources"
    method: POST
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: Prometheus
      type: prometheus
      url: "{{ prometheus_internal_url }}"
      access: proxy
      isDefault: true
    status_code: [200]
  when: _prom_existing.status == 404

- name: Update Prometheus datasource
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/datasources/{{ _prom_existing.json.id }}"
    method: PUT
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: Prometheus
      type: prometheus
      url: "{{ prometheus_internal_url }}"
      access: proxy
      isDefault: true
    status_code: [200, 403]
  when: _prom_existing.status == 200

# ── Datasource: Loki ────────────────────────────────────────────────────────

- name: Get existing Loki datasource
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/datasources/name/Loki"
    method: GET
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: _loki_existing

- name: Create Loki datasource
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/datasources"
    method: POST
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: Loki
      type: loki
      url: "{{ loki_internal_url }}"
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
        lokiVersion: "2.9.10"
        httpMethod: "POST"
    status_code: [200]
  when: _loki_existing.status == 404

- name: Update Loki datasource
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/datasources/{{ _loki_existing.json.id }}"
    method: PUT
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: Loki
      type: loki
      url: "{{ loki_internal_url }}"
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
        lokiVersion: "2.9.10"
        httpMethod: "POST"
    status_code: [200, 403]
  when: _loki_existing.status == 200

# ── Dashboard Import ────────────────────────────────────────────────────────

- name: Import Cloud Janitor Loki dashboard
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/dashboards/db"
    method: POST
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      dashboard: "{{ lookup('file', role_path + '/files/loki-dashboard.json') | from_json }}"
      overwrite: true
    status_code: [200]

# ── 결과 출력 ───────────────────────────────────────────────────────────────

- name: Show Grafana login info
  ansible.builtin.debug:
    msg:
      - "---------------------------------------------------"
      - "Grafana  : {{ grafana_url }}"
      - "ID       : {{ grafana_admin_user }}"
      - "PW       : {{ grafana_admin_password }}"
      - "---------------------------------------------------"

# ── Datasource: MySQL (CloudJanitorDB) Create/Update + UID ──────────────────

- name: Get existing CloudJanitorDB datasource
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/datasources/name/CloudJanitorDB"
    method: GET
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: _mysql_existing

- name: Create CloudJanitorDB datasource (MySQL)
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/datasources"
    method: POST
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: CloudJanitorDB
      type: mysql
      url: "mysql.default.svc.cluster.local:3306"
      user: "root"
      access: proxy
      isDefault: false
      jsonData:
        database: "cloud_janitor"
        tlsAuth: false
        tlsAuthWithCACert: false
      secureJsonData:
        password: "rootpassword"
    status_code: [200]
  when: _mysql_existing.status == 404

- name: Update CloudJanitorDB datasource (MySQL)
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/datasources/{{ _mysql_existing.json.id }}"
    method: PUT
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: CloudJanitorDB
      type: mysql
      url: "mysql.default.svc.cluster.local:3306"
      user: "root"
      access: proxy
      isDefault: false
      jsonData:
        database: "cloud_janitor"
        tlsAuth: false
        tlsAuthWithCACert: false
      secureJsonData:
        password: "rootpassword"
    status_code: [200, 403]
  when: _mysql_existing.status == 200

- name: Re-fetch CloudJanitorDB datasource (to get UID)
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/datasources/name/CloudJanitorDB"
    method: GET
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200]
  register: _mysql_ds

- name: Set MySQL datasource UID fact
  ansible.builtin.set_fact:
    mysql_ds_uid: "{{ _mysql_ds.json.uid }}"

# ── Alerting: Alert rule (JSON file) ───────────────────────────────────────

- name: Get all alert rules
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/v1/provisioning/alert-rules"
    method: GET
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200]
  register: _all_rules

- name: Define alert rule specs
  ansible.builtin.set_fact:
    _alert_rule_specs:
      - name: pending
        file: "{{ role_path }}/files/grafana-alerts-pending.json"
        uid: "pending-alerts"
      - name: deleted
        file: "{{ role_path }}/files/grafana-alerts-deleted.json"
        uid: "deleted-alerts"

- name: Ensure Cloud Janitor folder exists
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/folders"
    method: GET
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200]
  register: _all_folders

- name: Create Cloud Janitor folder if missing
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/folders"
    method: POST
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      uid: "cloud-janitor"
      title: "Cloud Janitor"
    status_code: [200, 201, 409, 412]
  when: "_all_folders.json | selectattr('uid', 'equalto', 'cloud-janitor') | list | length == 0"

- name: Build alert rule payload items
  ansible.builtin.set_fact:
    _alert_rule_items: >-
      {{
        (_alert_rule_items | default([])) + [
          {
            'name': item.name,
            'uid': item.uid,
            'payload': (
              (
                (lookup('file', item.file)
                | replace('__MYSQL_DS_UID__', mysql_ds_uid))
                | from_json
              )
              | combine(
                  {
                    'uid': item.uid,
                    'folderUID': 'cloud-janitor'
                  },
                  recursive=True
                )
            ),
            'existing': (_all_rules.json | selectattr('uid', 'equalto', item.uid) | list)
          }
        ]
      }}
  loop: "{{ _alert_rule_specs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create alert rule if missing (POST)
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/v1/provisioning/alert-rules"
    method: POST
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ item.payload }}"
    status_code: [201, 409]
  loop: "{{ _alert_rule_items }}"
  when: item.existing | length == 0

- name: Update alert rule if exists (PUT)
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/v1/provisioning/alert-rules/{{ item.uid }}"
    method: PUT
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ item.payload }}"
    status_code: [200]
  loop: "{{ _alert_rule_items }}"
  when: item.existing | length > 0

# ── Alerting: Contact points (JSON file) ────────────────────────────────────

- name: Load contact points JSON
  ansible.builtin.set_fact:
    _contact_points_payload: "{{ lookup('file', role_path + '/files/contact-points.json') | from_json }}"

- name: Apply contact points (create/update)
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/v1/provisioning/contact-points"
    method: POST
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    headers:
      Content-Type: "application/json"
      X-Disable-Provenance: "true"
    body_format: json
    body: "{{ item }}"
    status_code: [200, 201, 202]
  loop: "{{ _contact_points_payload }}"

# ── Alerting: Notification policy (route) ───────────────────────────────────

- name: Load notification policy JSON
  ansible.builtin.set_fact:
    _policy_payload: "{{ lookup('file', role_path + '/files/notification-policy.json') | from_json }}"

- name: Apply notification policy (replace)
  ansible.builtin.uri:
    url: "{{ grafana_url }}/api/v1/provisioning/policies"
    method: PUT
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    headers:
      Content-Type: "application/json"
      X-Disable-Provenance: "true"
    body_format: json
    body: "{{ _policy_payload }}"
    status_code: [200, 202]
