<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Janitor - Zombie Manager</title>
    <style>
        * {{ box-sizing: border-box; }}
        body {{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #1a1a2e; color: #eee; }}
        .container {{ max-width: 1400px; margin: 0 auto; }}
        h1 {{ color: #00d4ff; margin-bottom: 10px; }}
        .subtitle {{ color: #888; margin-bottom: 30px; }}
        table {{ width: 100%; border-collapse: collapse; background: #16213e; border-radius: 8px; overflow: hidden; }}
        th, td {{ padding: 10px 12px; text-align: left; border-bottom: 1px solid #2a3a5a; }}
        th {{ background: #0f3460; color: #00d4ff; font-weight: 600; }}
        tr:hover {{ background: #1f3a6a; }}
        .btn {{ padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin: 2px; text-decoration: none; display: inline-block; }}
        .btn-delete {{ background: #e74c3c; color: white; }}
        .btn-delete:hover {{ background: #c0392b; }}
        .btn-postpone {{ background: #f39c12; color: white; }}
        .btn-postpone:hover {{ background: #d68910; }}
        .btn-stop {{ background: #e67e22; color: white; }}
        .btn-stop:hover {{ background: #d35400; }}
        .btn-whitelist {{ background: #9b59b6; color: white; }}
        .btn-whitelist:hover {{ background: #8e44ad; }}
        .btn-log {{ background: #34495e; color: white; }}
        .btn-log:hover {{ background: #2c3e50; }}
        .status-pending {{ color: #f39c12; font-weight: bold; }}
        .status-stopped {{ color: #9b59b6; font-weight: bold; }}
        .status-deleted {{ color: #e74c3c; }}
        .status-recovered {{ color: #27ae60; }}
        .metrics {{ font-size: 11px; color: #888; }}
        .reason {{ font-size: 10px; color: #aaa; max-width: 300px; word-wrap: break-word; }}
        .result-msg {{ padding: 15px; margin: 20px 0; border-radius: 8px; }}
        .result-success {{ background: #1e8449; }}
        .result-error {{ background: #c0392b; }}
        .empty {{ text-align: center; padding: 40px; color: #888; }}
        .zombie {{ background: rgba(231, 76, 60, 0.1); }}
        .stopped {{ background: rgba(155, 89, 182, 0.1); }}
        
        /* Clickable row styles */
        .clickable-row {{ cursor: pointer; transition: background 0.2s; }}
        .clickable-row:hover {{ background: #1f3a6a; }}
        .clickable-row.selected {{ background: #2a4a7a; }}
        .log-row {{ display: none; }}
        .log-row.open {{ display: table-row; }}
        
        /* Log panel styles */
        .log-panel {{ 
            display: none; 
            background: #0d1117; 
            border: 1px solid #30363d; 
            border-radius: 6px; 
            margin: 10px 0; 
            max-height: 300px;
            overflow-y: auto;
        }}
        .log-panel.open {{ display: block; }}
        .log-content {{ 
            padding: 12px; 
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace; 
            font-size: 12px; 
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }}
        .log-line {{ padding: 2px 0; border-bottom: 1px solid #21262d; }}
        .log-time {{ color: #6e7681; }}
        .log-level-info {{ color: #58a6ff; }}
        .log-level-warn {{ color: #d29922; }}
        .log-level-error {{ color: #f85149; }}
        .log-level-debug {{ color: #8b949e; }}
        .log-loading {{ color: #888; padding: 20px; text-align: center; }}
        .log-error {{ color: #f85149; padding: 20px; }}
        
        /* Scrollbar styling */
        .log-panel::-webkit-scrollbar {{ width: 8px; }}
        .log-panel::-webkit-scrollbar-track {{ background: #161b22; }}
        .log-panel::-webkit-scrollbar-thumb {{ background: #30363d; border-radius: 4px; }}
        .log-panel::-webkit-scrollbar-thumb:hover {{ background: #484f58; }}
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Cloud Janitor</h1>
        <p class="subtitle">Zombie Container Management Dashboard</p>

        {message}
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>TC / Container</th>
                    <th>CPU (m)</th>
                    <th>MEM (Mi)</th>
                    <th>NET (B/s)</th>
                    <th>삭제 예정 (KST)</th>
                    <th>상태</th>
                    <th>액션</th>
                </tr>
            </thead>
            <tbody>
                {rows}
            </tbody>
        </table>
    </div>
    
    <script>
        function toggleLog(zombieId, tcName, containerName, evt) {{
            if (evt) evt.stopPropagation();
            
            const logRow = document.getElementById('log-row-' + zombieId);
            const panel = document.getElementById('log-' + zombieId);
            if (!panel || !logRow) {{
                console.log('Panel or logRow not found:', zombieId);
                return;
            }}
            
            // Close all other log rows
            document.querySelectorAll('.log-row').forEach(row => {{
                if (row.id !== 'log-row-' + zombieId) {{
                    row.classList.remove('open');
                    const p = row.querySelector('.log-panel');
                    if (p) p.classList.remove('open');
                }}
            }});
            
            if (panel.classList.contains('open')) {{
                panel.classList.remove('open');
                logRow.classList.remove('open');
                return;
            }}
            
            // Open panel and show loading
            panel.classList.add('open');
            logRow.classList.add('open');
            const content = panel.querySelector('.log-content');
            content.innerHTML = '<div class="log-loading">⏳ 로그 로딩 중... (Loki 연결 확인)</div>';
            
            // Try to fetch logs from Loki
            const target = encodeURIComponent(containerName || '');
            fetch('/api/v1/logs?container_name=' + target + '&limit=50')
                .then(r => r.json())
                .then(data => {{
                    console.log('Log response:', data);
                    if (data.error) {{
                        content.innerHTML = '<div class="log-error">❌ Loki 오류: ' + data.error + '</div>';
                        return;
                    }}
                    if (!data.logs || data.logs.length === 0) {{
                        content.innerHTML = '<div class="log-loading">📭 로그 없음 (컨테이너 또는 Loki 확인 필요)</div>';
                        return;
                    }}
                    let html = '';
                    data.logs.forEach(log => {{
                        const levelClass = (log.level || 'info').toLowerCase();
                        html += '<div class="log-line"><span class="log-time">' + (log.time || '') + '</span> <span class="log-level-' + levelClass + '">[' + (log.level || 'INFO') + ']</span> ' + (log.message || log) + '</div>';
                    }});
                    content.innerHTML = html;
                    panel.scrollTop = panel.scrollHeight;
                }})
                .catch(err => {{
                    console.error('Log fetch error:', err);
                    content.innerHTML = '<div class="log-error">❌ 로드 실패: ' + err.message + '</div>';
                }});
        }}
        
        function addToWhitelist(zombieId, tcName, containerName, evt) {{
            if (evt) evt.stopPropagation();
            if (!confirm('"' + containerName + '"을(를) 화이트리스트에 추가하시겠습니까?\\n\\n화이트리스트에 추가하면 좀비 감지에서 제외됩니다.')) {{
                return;
            }}
            
            fetch('/api/v1/targets/' + encodeURIComponent(tcName) + '/whitelist', {{
                method: 'POST',
                headers: {{ 'Content-Type': 'application/json' }},
                body: JSON.stringify({{ add_containers: [containerName] }})
            }})
            .then(r => r.json())
            .then(data => {{
                if (data.error) {{
                    alert('❌ 오류: ' + data.error);
                }} else {{
                    alert('✅ 화이트리스트에 추가되었습니다.');
                    // Remove row from UI
                    const row = document.querySelector('tr[data-zombie-id="' + zombieId + '"]');
                    const logRow = document.getElementById('log-row-' + zombieId);
                    if (row) row.remove();
                    if (logRow) logRow.remove();
                }}
            }})
            .catch(err => {{
                alert('❌ 요청 실패: ' + err.message);
            }});
        }}
        
        function stopZombie(zombieId, evt) {{
            if (evt) evt.stopPropagation();
            if (!confirm('이 컨테이너를 멈춤(STOPPED) 처리하시겠습니까?')) {{
                return false;
            }}
            
            fetch('/api/v1/zombies/' + zombieId + '/stop', {{ method: 'POST' }})
                .then(r => r.json())
                .then(data => {{
                    if (data.error) {{
                        alert('❌ 멈춤 처리 실패: ' + data.error);
                    }} else {{
                        // Remove row from UI
                        const row = document.querySelector('tr[data-zombie-id="' + zombieId + '"]');
                        const logRow = document.getElementById('log-row-' + zombieId);
                        if (row) row.remove();
                        if (logRow) logRow.remove();
                    }}
                }})
                .catch(err => {{
                    alert('❌ 요청 실패: ' + err.message);
                }});
            return false;
        }}
    </script>
</body>
</html>
