# =============================================================================
# Target Cluster Docker Compose (Apps Only)
# TC 고유 애플리케이션 컨테이너만 실행
# =============================================================================

services:
  # -----------------------------------------------------------------------------
  # Dummy Application 1: Active Web Server (정상 동작 앱)
  # -----------------------------------------------------------------------------
  app-active:
    image: nginx:alpine
    container_name: app-active
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - target-network
    labels:
      app-type: "active"
    command: >
      sh -c "
      echo 'Starting active web server...' &&
      nginx -g 'daemon off;' &
      while true; do
        for i in $$(seq 1 100); do
          echo $$i > /dev/null
        done
        curl -s http://localhost/ > /dev/null 2>&1 || true
        sleep 1
      done
      "

  # -----------------------------------------------------------------------------
  # Dummy Application 2: Zombie-like Idle Container
  # -----------------------------------------------------------------------------
  app-zombie-sleeper:
    image: busybox:latest
    container_name: app-zombie-sleeper
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "zombie"
      zombie-type: "idle"
    command: ["sleep", "infinity"]
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M

  # -----------------------------------------------------------------------------
  # Dummy Application 3: Zombie-like Completed Container
  # -----------------------------------------------------------------------------
  app-zombie-completed:
    image: alpine:latest
    container_name: app-zombie-completed
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "zombie"
      zombie-type: "completed"
    command: >
      sh -c "
      echo 'Task completed. Waiting for cleanup...' &&
      sleep infinity
      "
    deploy:
      resources:
        limits:
          cpus: '0.02'
          memory: 32M
        reservations:
          cpus: '0.005'
          memory: 8M

  # -----------------------------------------------------------------------------
  # Dummy Application 4: Zombie-like Test Container
  # -----------------------------------------------------------------------------
  app-zombie-test:
    image: nginx:alpine
    container_name: app-zombie-test
    restart: unless-stopped
    ports:
      - "8082:80"
    networks:
      - target-network
    labels:
      app-type: "zombie"
      zombie-type: "forgotten"
      environment: "test"
    command: >
      sh -c "
      echo 'Test environment finished. Nobody cleaned me up.' &&
      nginx -g 'daemon off;' &
      sleep infinity
      "
    deploy:
      resources:
        limits:
          cpus: '0.02'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M

  # -----------------------------------------------------------------------------
  # Dummy Application 5: Zombie-like Dev Container
  # -----------------------------------------------------------------------------
  app-zombie-dev:
    image: redis:alpine
    container_name: app-zombie-dev
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "zombie"
      zombie-type: "stale"
      environment: "dev"
    deploy:
      resources:
        limits:
          cpus: '0.02'
          memory: 64M
        reservations:
          cpus: '0.005'
          memory: 16M

networks:
  target-network:
    driver: bridge
    name: tc-network
    external: true
