# =============================================================================
# Target Cluster Docker Compose (Apps Only)
# TC 고유 애플리케이션 컨테이너만 실행
# =============================================================================

version: '3.8'

services:
  # ============================================================================
  # [🔥 코어 인프라] 내부 트래픽 발생용 더미 서버 (외부 인터넷 차단 방지용)
  # ============================================================================
  internal-dummy-server:
    image: nginx:alpine
    container_name: internal-dummy-server
    restart: unless-stopped
    networks:
      - target-network
    # 10MB짜리 더미 파일과 가짜 API 엔드포인트를 켜자마자 만듭니다.
    command: >
      sh -c "mkdir -p /usr/share/nginx/html/api &&
             dd if=/dev/zero of=/usr/share/nginx/html/dummy_10mb.bin bs=1M count=10 2>/dev/null &&
             echo '{\"status\":\"ok\"}' > /usr/share/nginx/html/api/endpoint &&
             nginx -g 'daemon off;'"

  # ============================================================================
  # [정상 작동 파드 - 5개] 고부하 및 지속적인 작업 수행
  # ============================================================================

  # 1. LLM-Train-Master 
  # [지표: 높은 CPU, 중간 Mem]
  llm-train-master:
    image: alpine:latest
    container_name: llm-train-master
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "active"
      role: "master-node"
    command: >
      sh -c "echo 'Master Node Syncing...' && while true; do dd if=/dev/zero of=/dev/null bs=1M count=100 2>/dev/null; sleep 0.1; done"

  # 2. LLM-Train-Worker-01 
  # [지표: 높은 CPU, 중간 Mem]
  llm-train-worker-01:
    image: alpine:latest
    container_name: llm-train-worker-01
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "active"
      role: "gpu-worker"
    command: >
      sh -c "echo 'Worker computing...' && while true; do dd if=/dev/zero of=/dev/null bs=1M count=80 2>/dev/null; sleep 0.2; done"

  # 3. HuggingFace-Data-Loader 
  # [지표: 극단적인 Net Rx(수신), 약간의 CPU] -> 내부 더미 서버에서 다운로드
  hf-data-loader:
    image: alpine:latest
    container_name: hf-data-loader
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "active"
      role: "data-loader"
    command: >
      sh -c "apk add --no-cache curl && while true; do curl -s http://internal-dummy-server/dummy_10mb.bin > /dev/null; sleep 1; done"

  # 4. BPE-Tokenizer-Engine 
  # [지표: CPU 100%, 높은 Disk Write]
  bpe-tokenizer-engine:
    image: busybox:latest
    container_name: bpe-tokenizer-engine
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "active"
      role: "tokenizer"
    command: >
      sh -c "while true; do echo 'Tokenizing...' > /tmp/tokens.txt; cat /tmp/tokens.txt > /dev/null; done"

  # 5. Corpus-Quality-Filter 
  # [지표: 높은 CPU]
  corpus-quality-filter:
    image: alpine:latest
    container_name: corpus-quality-filter
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "active"
    command: >
      sh -c "while true; do grep -q 'noise' /etc/passwd 2>/dev/null || true; done"

  # ============================================================================
  # [좀비 파드 - 7개] 모든 자원 사용량 0 (완벽한 깡통)
  # ============================================================================

  # 16. Finished-LLaMA-Tuning 
  # [지표: CPU 0, Mem 고정, Net 0]
  finished-llama-tuning:
    image: alpine:latest
    container_name: finished-llama-tuning
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "zombie"
      zombie-type: "completed"
    command: ["sh", "-c", "echo 'Training Finished. Saving Weights...' && sleep infinity"]

  # 17. OOM-Hung-Trainer 
  # [지표: CPU 0, Mem 고정(데드락), Net 0]
  oom-hung-trainer:
    image: busybox:latest
    container_name: oom-hung-trainer
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "zombie"
      zombie-type: "deadlock"
    command: ["sleep", "infinity"]

  # 18. S3-Auth-Failed-Loader 
  # [지표: CPU 0, Mem 최소, Net 0]
  s3-auth-failed-loader:
    image: alpine:latest
    container_name: s3-auth-failed-loader
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "zombie"
      zombie-type: "error-loop"
    command: ["sh", "-c", "echo '403 Forbidden: S3 Token Expired'; sleep infinity"]

  # 19. Disk-Full-Saver 
  # [지표: CPU 0, Mem 최소, Disk Wait(멈춤)]
  disk-full-saver:
    image: alpine:latest
    container_name: disk-full-saver
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "zombie"
      zombie-type: "io-wait"
    command: ["sh", "-c", "echo 'No space left on device'; sleep infinity"]

  # 20. Orphaned-Jupyter-Lab 
  # [지표: 전부 0]
  orphaned-jupyter-lab:
    image: nginx:alpine
    container_name: orphaned-jupyter-lab
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "zombie"
      zombie-type: "idle"
    command: ["nginx", "-g", "daemon off;"]

  # 21. v1-Inference-Endpoint 
  # [지표: 전부 0]
  v1-inference-endpoint:
    image: nginx:alpine
    container_name: v1-inference-endpoint
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "zombie"
      zombie-type: "abandoned-api"
    command: ["nginx", "-g", "daemon off;"]

  # 22. GPU-Pending-Zombie 
  # [지표: 전부 0]
  gpu-pending-zombie:
    image: busybox:latest
    container_name: gpu-pending-zombie
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "zombie"
      zombie-type: "pending"
    command: ["sleep", "infinity"]

  # ============================================================================
  # [특정 시간에만 작동 - 8개] 스케일 다운 (최대 5분 주기)
  # ============================================================================

  # 23. S3-Checkpoint-Syncer 
  # [타이밍: 3분 대기 -> 약 20초 작동]
  # [지표: Cup, Mup 극대화]
  s3-checkpoint-syncer:
    image: alpine:latest
    container_name: s3-checkpoint-syncer
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "periodic"
    command: >
     sh -c "while true; do sleep 180; echo 'Syncing to S3...'; dd if=/dev/zero of=/tmp/dummy bs=1M count=800 2>/dev/null; cat /tmp/dummy > /dev/null; dd if=/dev/urandom bs=1M count=50 2>/dev/null | md5sum; rm -f /tmp/dummy; sleep 10; done"
  # 24. Daily-Corpus-Validator 
  # [타이밍: 4분 대기 -> 약 20초 작동]
  # [지표: 엄청난 Cup 극대화]
  daily-corpus-validator:
    image: alpine:latest
    container_name: daily-corpus-validator
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "periodic"
    command: >
     sh -c "while true; do sleep 240; echo 'Validating Corpus...'; dd if=/dev/urandom bs=1M count=100 2>/dev/null | md5sum; sleep 15; done"

  # 25. GPU-Lock-Sweeper 
  # [타이밍: 50초 대기 -> 약 10초 작동]
  # [지표: 짧지만 날카로운 Cup, Mup]
  gpu-lock-sweeper:
    image: alpine:latest
    container_name: gpu-lock-sweeper
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "periodic"
    command: >
      sh -c "while true; do sleep 50; echo 'Clearing locks...'; dd if=/dev/urandom bs=1M count=30 2>/dev/null | md5sum; sleep 5; done"

  # 26. Inference-Metrics-Aggregator 
  # [타이밍: 켜자마자 10초 작동 -> 3분 대기 무한 반복]
  # [지표: Nup 극대화, Mup, Cup]
  inference-metrics-aggregator:
    image: alpine:latest
    container_name: inference-metrics-aggregator
    restart: unless-stoppeddd if=/dev/zero of=/tmp/dummy
    networks:
      - target-network
    labels:
      app-type: "periodic"
    command: >
      sh -c "apk add --no-cache curl && while true; do echo 'Aggregating...'; for i in \$(seq 1 100); do curl -s http://internal-dummy-server/api/endpoint > /dev/null & done; wait; dd if=/dev/urandom bs=1M count=40 2>/dev/null | md5sum; sleep 180; done"
  # 27. Weekly-Cache-Evictor 
  # [타이밍: 3분 30초 대기 -> 약 20초 작동]
  # [지표: 무식한 Mup 극대화]
  weekly-cache-evictor:
    image: busybox:latest
    container_name: weekly-cache-evictor
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "periodic"
    command: >
      sh -c "apk add --no-cache curl && while true; do sleep 180; for i in \$(seq 1 20); do curl -s http://internal-dummy-server/api/endpoint > /dev/null; done; dd if=/dev/zero of=/dev/null bs=5M count=100 2>/dev/null; sleep 10; done"

  # 28. HF-Model-Syncer 
  # [타이밍: 4분 30초 대기 -> 약 20초 작동]
  # [지표: 최강의 Nup 폭탄, Cup]
  hf-model-syncer:
    image: alpine:latest
    container_name: hf-model-syncer
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "periodic"
    command: >
      sh -c "apk add --no-cache curl && while true; do sleep 270; echo 'Syncing...'; for i in \$(seq 1 200); do curl -s http://internal-dummy-server/api/endpoint > /dev/null & done; wait; dd if=/dev/urandom bs=1M count=80 2>/dev/null | md5sum; sleep 10; done"

  # 29. Nvidia-SMI-Alerter 
  # [타이밍: 30초 대기 -> 약 5초 작동]
  # [지표: 찌르기용 Cup, Mup]
  nvidia-smi-alerter:
    image: busybox:latest
    container_name: nvidia-smi-alerter
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "periodic"
    command: >
      sh -c "while true; do sleep 30; echo 'GPU Temp OK'; dd if=/dev/urandom bs=1M count=20 2>/dev/null | md5sum; sleep 2; done"

  # 30. Midnight-RLHF-Cron 
  # [타이밍: 5분 대기 -> 약 40초 작동]
  # [지표: Cup, Mup, Nup 모든 지표의 최종 보스]
  midnight-rlhf-cron:
    image: alpine:latest
    container_name: midnight-rlhf-cron
    restart: unless-stopped
    networks:
      - target-network
    labels:
      app-type: "periodic"
    command: >
      sh -c "apk add --no-cache curl && while true; do sleep 300; echo 'Starting RLHF...'; dd if=/dev/zero of=/tmp/boss bs=1M count=1000 2>/dev/null; cat /tmp/boss > /dev/null; rm -f /tmp/boss; for i in \$(seq 1 100); do curl -s http://internal-dummy-server/api/endpoint > /dev/null & done; wait; dd if=/dev/urandom bs=1M count=100 2>/dev/null | md5sum; sleep 20; done"

networks:
  target-network:
    driver: bridge
    name: tc-network
    external: true